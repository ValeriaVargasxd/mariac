<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>64 Años | María Oscanoa Medina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #060609;
      --card-bg: #121217;
      --gold-light: #FFF0A8;
      --gold-bright: #F5D061;
      --gold-main: #D4AF37;
      --gold-dark: #997A15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: #F8F5EE;
      font-family: 'Montserrat', Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 60%, rgba(212, 175, 55, 0.12) 0%, transparent 45%);
    }

    /* Barra superior */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(6, 6, 9, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding: 12px 18px;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .nav-brand {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 2px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      color: #E5E5E5;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--gold-bright);
    }

    /* Contenedor general */
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 82px 16px 40px;
      position: relative;
      z-index: 2;
    }

    section {
      margin-bottom: 42px;
    }

    .card {
      background: linear-gradient(180deg, rgba(22, 22, 29, 0.96) 0%, rgba(11, 11, 15, 0.98) 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 22px;
      padding: 32px 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
      text-align: center;
    }

    /* Textos dorados */
    .gold-text {
      background: linear-gradient(135deg, #FFF0A8 0%, #F5D061 40%, #D4AF37 75%, #FFF0A8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #F5D061;
    }

    .eyebrow {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.9rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .hero-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 1.15;
      margin: 6px 0 22px;
      filter: drop-shadow(0 3px 10px rgba(212, 175, 55, 0.35));
    }

    /* Retrato circular de María */
    .portrait-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 18px 0 26px;
    }

    .serpentina {
      width: 48px;
      height: 140px;
      flex-shrink: 0;
    }
